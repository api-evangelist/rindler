aid: rindler
name: Rindler
description: >-
  Rindler is a Y Combinator (Summer 2026) company that operates a hosted Model
  Context Protocol (MCP) server turning any pre-onboarded website — including
  sites that have no API — into a deterministic, typed set of tools that AI
  agents can reliably use. Agents open a session against a mapped site, dispatch
  a semantic action (search, add to cart, submit a form, move a candidate, pull
  a statement), and receive structured JSON records instead of raw HTML,
  accessibility trees, or DOM selectors. Rindler handles authentication, 2FA,
  pop-ups, bot defenses, navigation, retries, and error recovery server-side,
  and re-verifies each site mapping against the real site before shipping it.
  It targets legacy portals, private SaaS dashboards, government registries,
  healthcare/insurance portals, ATS systems, and bank/brokerage sites.
