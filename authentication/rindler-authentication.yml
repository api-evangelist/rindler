notes: >-
  Rindler authenticates agents over OAuth 2.0 with PKCE. On first tool call the
  runtime opens a browser authorization link; the user approves and tokens
  refresh automatically. There is no API key to paste. The MCP server also
  supports RFC 7591 dynamic client registration (register-client) and RFC 9728
  protected-resource metadata. Separately, each mapped site session
  authenticates to the target portal the way the user's own team does
  (site-side credentials), handled server-side.
